<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Rekonštrukcia bytu – rozpočet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;color:#1e293b;background:#f8fafc}
.wrap{max-width:1200px;margin:0 auto}
.topbar{background:#1e3a5f;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h1{font-size:16px;font-weight:600;color:#fff}
.sv-ind{font-size:12px;color:#86efac;margin-left:10px;opacity:0;transition:opacity .4s}
.sv-ind.on{opacity:1}
.btnbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sep{width:1px;height:24px;background:#cbd5e1;margin:0 2px}
.lbl{font-size:11px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
button.b{border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;background:#fff;color:#1e293b;font-family:inherit;white-space:nowrap;min-height:38px;transition:opacity .15s}
button.b:hover:not(:disabled){background:#f1f5f9}
button.b:disabled{opacity:.32;cursor:default}
button.b.ubtn{padding:8px 12px;font-size:18px}
button.b.bl{background:#2563eb;color:#fff;border-color:#2563eb}
button.b.or{background:#ea580c;color:#fff;border-color:#ea580c}
button.b.rst{background:#fff;color:#dc2626;border-color:#fca5a5}
button.b.rst:hover{background:#fef2f2}
.improw{background:#fefce8;border-bottom:1px solid #fcd34d;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.improw.h{display:none}
.improw p{font-size:13px;color:#92400e;font-weight:500}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 20px;background:#f1f5f9;border-bottom:1px solid #e2e8f0}
.stat{padding:11px 14px;border-radius:8px;border:1px solid #e2e8f0;background:#fff}
.sl{font-size:12px;color:#64748b;font-weight:500;margin-bottom:3px}
.sv{font-size:18px;font-weight:600;color:#0f172a}
.rooms-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:#fffbeb;border-bottom:1px solid #fcd34d}
.rooms-lbl{font-size:13px;font-weight:600;color:#92400e;text-transform:uppercase;letter-spacing:.03em}
.rtog{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border:1.5px solid #fcd34d;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500;color:#1e293b;user-select:none}
.rtog input{width:20px;height:20px;cursor:pointer;accent-color:#16a34a;flex-shrink:0}
.rtog.off{background:#f1f5f9;border-color:#cbd5e1;color:#94a3b8;text-decoration:line-through}
.rtog.off .rtog-a{text-decoration:none;color:#dc2626;font-weight:700;margin-left:2px}
.rtog-a{font-variant-numeric:tabular-nums}
.rooms-save{margin-left:auto;font-size:15px;font-weight:700;color:#15803d;background:#dcfce7;padding:8px 14px;border-radius:9px}
.alts-barw{background:#eff6ff;border-bottom:1px solid #bfdbfe}
.atog{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;background:#fff;border:1.5px solid #bfdbfe;border-radius:9px;cursor:pointer;font-size:14px;color:#1e293b;user-select:none;flex-wrap:wrap}
.atog input{width:20px;height:20px;cursor:pointer;accent-color:#2563eb;flex-shrink:0}
.atog.on{background:#dcfce7;border-color:#86efac}
.atog-t{font-weight:600}
.atog-p{font-size:13px;color:#64748b}
.atog-p b{color:#15803d}
.atog-prov{color:#2563eb;font-weight:500}
.atog-s{font-size:13px;font-weight:700;color:#15803d}
.atog-note{flex-basis:100%;font-size:11px;color:#94a3b8;margin-top:2px}
.atog-firm{font-size:10px;font-weight:700;color:#15803d;background:#dcfce7;padding:1px 6px;border-radius:6px;vertical-align:middle}
.atog-orient{font-size:10px;font-weight:700;color:#b45309;background:#fef3c7;padding:1px 6px;border-radius:6px;vertical-align:middle}
.alts-sum{margin-left:auto;font-size:14px;color:#334155;background:#fff;border:1px solid #bfdbfe;padding:8px 14px;border-radius:9px}
/* Category summary */
.csrow{background:#fff;border-bottom:1px solid #e2e8f0}
.cshr{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;cursor:pointer;user-select:none;background:#f8fafc}
.cshr span{font-size:14px;font-weight:500;color:#1e293b}
.csbd{padding:0 20px 12px;background:#fff}
.cstbl{width:100%;border-collapse:collapse;font-size:14px}
.cstbl th{padding:7px 10px;text-align:left;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e2e8f0;background:#f8fafc}
.cstbl td{padding:6px 10px;border-bottom:1px solid #f1f5f9;color:#1e293b}
.cstbl tr:last-child td{font-weight:600;background:rgba(217,119,6,.06);border-bottom:none}
.cstbl tr.cs-jump{cursor:pointer;-webkit-tap-highlight-color:rgba(37,99,235,.25)}
.cstbl tr.cs-jump:active td{background:rgba(37,99,235,.16)}
@media(hover:hover){.cstbl tr.cs-jump:hover td{background:rgba(37,99,235,.09)}}
.cstbl tr.cs-jump td:first-child::after{content:" ↧";color:#93c5fd;font-size:11px}
.cdot{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:7px;vertical-align:middle}
/* Categories */
.cats{padding:12px 20px;display:flex;flex-direction:column;gap:10px}
.cat{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;background:#fff;scroll-margin-top:66px}
.cat.flash{animation:catflash 1.1s ease-out}
@keyframes catflash{0%{box-shadow:0 0 0 3px rgba(37,99,235,.55)}100%{box-shadow:0 0 0 3px rgba(37,99,235,0)}}
.ch{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;cursor:pointer;user-select:none}
.cn{font-size:14px;font-weight:600;color:#fff}
.ct{font-size:15px;font-weight:600;color:rgba(255,255,255,.9)}
.cbg{font-size:11px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.2);padding:2px 7px;border-radius:8px;margin-left:5px}
/* Desktop table */
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{background:#f8fafc;padding:7px 10px;text-align:left;font-size:11px;font-weight:600;color:#64748b;border-bottom:1px solid #e2e8f0;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:#1e293b}
.dh{cursor:grab;color:#94a3b8;font-size:15px;background:none;border:none;padding:0 4px;line-height:1;display:block}
tr.R{border-left:3px solid transparent}
tr.R.Zaplatené{border-left-color:#16a34a;background:rgba(22,163,74,.06)}
tr.R.Objednané{border-left-color:#2563eb;background:rgba(37,99,235,.06)}
tr.R.Určené{border-left-color:#d97706;background:rgba(217,119,6,.06)}
tr.R.Odhad{border-left-color:#ea580c}
tr.R.edi{background:rgba(59,130,246,.08)!important}
.ec{cursor:text}.ec:hover{background:rgba(59,130,246,.07)}
.inp{border:2px solid #3b82f6;border-radius:5px;padding:4px 8px;font-size:14px;font-family:inherit;background:#fff;color:#1e293b}
.inp.w{width:100%}.inp.r{text-align:right}
.ss{width:100%;border:1px solid #cbd5e1;border-radius:5px;font-size:13px;font-weight:600;padding:5px 6px;cursor:pointer;font-family:inherit;background:#fff;color:#1e293b}
.ss.Zaplatené{background:#dcfce7;color:#15803d;border-color:#86efac}
.ss.Objednané{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
.ss.Určené{background:#fef3c7;color:#b45309;border-color:#fcd34d}
.ss.Odhad{background:#ffedd5;color:#c2410c;border-color:#fdba74}
.tot{text-align:right;font-weight:600;color:#0f172a;font-variant-numeric:tabular-nums}
a.ul{color:#2563eb;font-size:13px;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis}
a.ul:hover{text-decoration:underline}
.be{background:#0284c7;color:#fff;border:none;border-radius:5px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;min-height:32px}
.be:hover{background:#0369a1}.be.ac{background:#1e3a5f}
.bd{background:#dc2626;color:#fff;border:none;border-radius:5px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-left:4px;min-height:32px}
.bd:hover{background:#b91c1c}
.sr td{background:#f1f5f9;border-top:2px solid #cbd5e1}
.srl{font-size:13px;color:#64748b;font-weight:500}
.srv{font-size:17px;font-weight:600;text-align:right;color:#0f172a}
.addbtn{display:flex;align-items:center;gap:7px;padding:11px 16px;font-size:14px;color:#2563eb;background:rgba(37,99,235,.05);border:none;cursor:pointer;width:100%;border-top:1px solid #e2e8f0;font-family:inherit;font-weight:600;min-height:44px}
.addbtn:hover{background:rgba(37,99,235,.1)}
/* Desktop edit panel */
.ep td{padding:0}
.epin{padding:16px;background:rgba(59,130,246,.05);border-top:2px solid #3b82f6;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.epin .ff{grid-column:1/-1}.epin .f2{grid-column:span 2}
.fl{font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.fi{padding:9px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;font-family:inherit;background:#fff;color:#1e293b;width:100%}
.fi:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.2)}
.epbtns{grid-column:1/-1;display:flex;justify-content:flex-end;gap:9px;padding-top:8px;border-top:1px solid #bfdbfe}
.bsv{background:#2563eb;color:#fff;border:none;border-radius:6px;padding:9px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;min-height:40px}
.bsv:hover{background:#1d4ed8}
.bcn{background:#fff;color:#374151;border:1px solid #d1d5db;border-radius:6px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit;min-height:40px}
.bcn:hover{background:#f9fafb}
.upv{font-size:12px;color:#2563eb;word-break:break-all;margin-top:4px;display:block}
.helprow{text-align:center;font-size:12px;color:#94a3b8;padding:9px;background:#f8fafc;border-top:1px solid #e2e8f0}
.fmsg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 24px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;color:#fff;z-index:99}
.fmsg.on{opacity:1}

/* ═══════════════════════════════════════════════════
   MOBILE CARD VIEW  (max-width: 768px)
═══════════════════════════════════════════════════ */
.mc-list{display:none}

@media(max-width:768px){
  .wrap{max-width:100%}
  body{font-size:17px}
  .topbar{padding:13px 16px}.topbar h1{font-size:19px}
  .btnbar{gap:8px;padding:12px 14px}
  button.b{padding:12px 16px;font-size:15px;min-height:52px;border-radius:9px}
  button.b.ubtn{padding:12px 14px;font-size:22px}
  .lbl{font-size:13px}.sep{height:30px}
  .stats{grid-template-columns:1fr 1fr;gap:9px;padding:13px 14px}
  .rooms-bar{padding:13px 14px;gap:10px}
  .rtog{font-size:15px;padding:12px 14px;width:100%}
  .rtog input{width:24px;height:24px}
  .rooms-lbl{width:100%;font-size:13px}
  .rooms-save{margin-left:0;width:100%;text-align:center;font-size:16px}
  .stat{padding:14px 14px;border-radius:10px}
  .sl{font-size:14px;margin-bottom:5px}.sv{font-size:24px}
  .cshr{padding:14px 16px}.cshr span{font-size:17px}
  .cstbl{font-size:16px}.cstbl td{padding:9px 12px}.cstbl th{font-size:13px;padding:8px 12px}
  .ch{padding:15px 16px}.cn{font-size:17px}.ct{font-size:18px}.cbg{font-size:13px;padding:3px 9px}
  /* Hide desktop table, show mobile cards */
  .dt-view{display:none!important}
  .mc-list{display:block}
  /* Desktop edit panel mobile override */
  .epin{grid-template-columns:1fr;gap:12px;padding:18px}
  .epin .ff,.epin .f2{grid-column:1}.epbtns{grid-column:1}
  .fi{font-size:18px;padding:14px 14px}
  .fl{font-size:14px;margin-bottom:6px}
  .bsv{font-size:18px;min-height:56px;padding:14px 28px}
  .bcn{font-size:18px;min-height:56px;padding:14px 20px}
  .cats{padding:12px 14px}
  .helprow{font-size:14px;padding:13px}
  .srl{font-size:14px}.srv{font-size:20px}
}

/* Mobile card styles (always defined, only shown on mobile) */
.mc{border-left:5px solid #e2e8f0;padding:18px 16px;border-bottom:1px solid #f1f5f9;background:#fff;position:relative}
.mc.Zaplatené{border-left-color:#16a34a;background:rgba(22,163,74,.05)}
.mc.Objednané{border-left-color:#2563eb;background:rgba(37,99,235,.05)}
.mc.Určené{border-left-color:#d97706;background:rgba(217,119,6,.05)}
.mc.Odhad{border-left-color:#ea580c}
.mc-name{font-size:19px;font-weight:500;color:#0f172a;margin-bottom:8px;line-height:1.35;white-space:normal;word-break:break-word}
.mc-detail{font-size:15px;color:#64748b;margin-bottom:12px}
.mc-ded{font-size:15px;color:#dc2626;font-weight:600;margin:-6px 0 12px}
.alt-tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;padding:1px 7px;border-radius:7px;white-space:nowrap}
.alt-tag.on{color:#15803d;background:#dcfce7;border-color:#86efac}
.alt-line{margin-top:5px;font-size:12.5px;color:#1d4ed8;background:#eff6ff;border-left:3px solid #2563eb;padding:5px 9px;border-radius:5px;white-space:normal;line-height:1.35}
.alt-line.on{color:#15803d;background:#dcfce7;border-left-color:#16a34a}
.mc-alt{font-size:14px;color:#2563eb;font-weight:600;background:#eff6ff;border-radius:8px;padding:8px 12px;margin-bottom:10px}
.mc-alt.on{color:#15803d;background:#dcfce7}
.mc-dph{font-size:14px;color:#dc2626;font-weight:600;margin-top:10px;padding-top:10px;border-top:1px dashed #e2e8f0}
.mc-dph-g{color:#94a3b8;font-weight:500}
.mc-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mc-tot{font-size:28px;font-weight:700;color:#0f172a;font-variant-numeric:tabular-nums;flex:1;min-width:140px}
.mc-ss{border:1px solid #cbd5e1;border-radius:9px;font-size:16px;font-weight:600;padding:12px 12px;cursor:pointer;font-family:inherit;min-height:52px;width:170px;flex-shrink:0}
.mc-ss.Zaplatené{background:#dcfce7;color:#15803d;border-color:#86efac}
.mc-ss.Objednané{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
.mc-ss.Určené{background:#fef3c7;color:#b45309;border-color:#fcd34d}
.mc-ss.Odhad{background:#ffedd5;color:#c2410c;border-color:#fdba74}
.mc-actions{display:flex;gap:9px;margin-top:13px}
.mc-be{background:#0284c7;color:#fff;border:none;border-radius:9px;padding:14px 20px;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;min-height:54px;flex:1}
.mc-be.ac{background:#1e3a5f}
.mc-bd{background:#dc2626;color:#fff;border:none;border-radius:9px;padding:14px 20px;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;min-height:54px;width:75px;flex-shrink:0}
/* Mobile edit panel */
.mc-ep{padding:18px 16px;background:rgba(59,130,246,.06);border-top:2px solid #3b82f6}
.mc-ep .efl{font-size:14px;font-weight:700;color:#475569;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;margin-top:16px;display:block}
.mc-ep .efl:first-child{margin-top:0}
.mc-fi{padding:14px 14px;border:1.5px solid #cbd5e1;border-radius:9px;font-size:18px;font-family:inherit;background:#fff;color:#1e293b;width:100%;display:block;margin-bottom:2px}
.mc-fi:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.mc-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.mc-btns{display:flex;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid #bfdbfe}
.mc-bsv{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:16px 0;font-size:19px;font-weight:700;cursor:pointer;font-family:inherit;min-height:58px;flex:1}
.mc-bcn{background:#fff;color:#374151;border:1.5px solid #d1d5db;border-radius:10px;padding:16px 0;font-size:19px;cursor:pointer;font-family:inherit;min-height:58px;flex:1}
.mc-url{display:block;color:#2563eb;font-size:15px;margin-top:8px;word-break:break-all;text-decoration:none}
.mc-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:9px 14px;background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.2);border-radius:8px;color:#2563eb;font-size:15px;font-weight:500;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-link:hover{background:rgba(37,99,235,.14)}
.mc-sub{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;background:#f1f5f9;border-top:2px solid #cbd5e1}
.mc-sub-l{font-size:15px;color:#64748b;font-weight:500}
.mc-sub-v{font-size:24px;font-weight:700;color:#0f172a;font-variant-numeric:tabular-nums}
.mc-add{display:flex;align-items:center;justify-content:center;gap:9px;padding:20px;font-size:18px;color:#2563eb;background:rgba(37,99,235,.06);border:none;cursor:pointer;width:100%;border-top:1px solid #e2e8f0;font-family:inherit;font-weight:700;min-height:62px}
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center">
    <h1>🏠 Rekonštrukcia bytu</h1>
    <span class="sv-ind" id="si">✓ Uložené</span>
  </div>
</div>
<div class="wrap">
<div class="btnbar">
  <button class="b ubtn" id="btn-u" onclick="undo()" title="Späť (Ctrl+Z)" disabled>↩</button>
  <button class="b ubtn" id="btn-r" onclick="redo()" title="Vpred (Ctrl+Y)" disabled>↪</button>
  <div class="sep"></div>
  <span class="lbl">Záloha:</span>
  <button class="b bl" onclick="expJSON()">⬇ JSON</button>
  <button class="b or" onclick="togImp()">⬆ Načítať</button>
  <div class="sep"></div>
  <button class="b rst" onclick="resetAll()" title="Zmazať uložené a načítať čerstvú verziu">🔄 Reset</button>
</div>
<div class="improw h" id="improw">
  <p>📂 Vyber JSON súbor:</p>
  <input type="file" accept=".json" id="finp" onchange="impJSON(this)" style="font-size:15px">
  <button class="bcn" onclick="togImp()" style="font-size:14px;padding:9px 14px;min-height:42px">Zrušiť</button>
</div>
<div class="stats" id="stats"></div>
<div class="rooms-bar" id="rooms-bar"></div>
<div class="rooms-bar alts-barw" id="alts-bar"></div>
<div class="csrow">
  <div class="cshr" onclick="togCS()"><span>📊 Súhrn podľa kategórií</span><span id="cs-tog" style="font-size:22px;color:#94a3b8">▴</span></div>
  <div id="cs-body" class="csbd"></div>
</div>
<div class="cats" id="cats"></div>
<div class="helprow">Desktop: klikni na <b>názov/cenu</b> → editácia, Ctrl+Z/Y = undo/redo &nbsp;|&nbsp; Mobile: ✏ Upraviť → všetky polia</div>
</div>
<div class="fmsg" id="fmsg"></div>

<script>
const SO=["Zaplatené","Objednané","Určené","Odhad"];
const SI={Zaplatené:"🟢",Objednané:"🔵",Určené:"🟡",Odhad:"🟠"};
const CC=["#4472C4","#843C0C","#7F6000","#595959","#17375E","#3E5E1E","#1E4620","#99260F","#215868","#3E2160","#7B5E00","#404040","#2E2E2E","#1F6F5C"];

/* Izby, ktoré sa dajú "vypnúť" (neprerábať). Odpočet sa počíta z 'rooms' na jednotlivých položkách. */
const ROOMS={
  detska:{label:"Detská izba",area:14.5},
  spalna:{label:"Spálňa (rodičia)",area:18}
};

/* ── ALTERNATÍVNE PONUKY ────────────────────────────────────
   Každá alternatíva nahrádza sadu položiek (podľa názvu) jednou cenou od iného dodávateľa.
   Cena alternatívy je FINÁLNA (bez pripočítania DPH). */
const ALTS=[];
let altOn={};
// vráti aktívnu alternatívu pokrývajúcu danú položku (alebo null)
function altForItem(it){for(const a of ALTS){if(altOn[a.id]&&a.covers.includes(it.n))return a;}return null;}
// existuje alternatíva pre položku (aj neaktívna)?
function altExists(it){for(const a of ALTS){if(a.covers.includes(it.n))return a;}return null;}
// koľko MJ danej položky pripadá na vypnuté izby
function offQty(it){if(!it.rooms)return 0;let q=0;for(const k in it.rooms){if(!roomOn[k])q+=it.rooms[k]||0;}return q;}
// efektívny počet po odpočte vypnutých izieb
function effQty(it){return Math.max(0,(it.qty||0)-offQty(it));}
// suma položky, ktorú reálne zaplatíš (po odpočte)
function itemNet(it){return effQty(it)*(it.up||0);}
// koľko € sa odráta z položky kvôli vypnutým izbám
function itemDed(it){return offQty(it)*(it.up||0);}
// úspora jednej izby (bez DPH – Modul aj materiál sa počítajú priamo)
function roomSaving(k){let mat=0,work=0;D.forEach(c=>c.items.forEach(it=>{if(it.rooms&&it.rooms[k]){const v=it.rooms[k]*(it.up||0);if(it.sup==='Modul Company')work+=v;else mat+=v;}}));return mat+work;}

/* ── UNDO/REDO ─────────────────────────────────────────── */
function pushHist(){hist=hist.slice(0,histIdx+1);hist.push(JSON.stringify(D));if(hist.length>MAX_HIST)hist.shift();else histIdx++;updUR();}
function updUR(){const u=document.getElementById('btn-u'),r=document.getElementById('btn-r');if(u)u.disabled=histIdx<=0;if(r)r.disabled=histIdx>=hist.length-1;}
function undo(){if(histIdx<=0)return;histIdx--;D=JSON.parse(hist[histIdx]);_sv();ek=null;iec=null;newItem=null;render();updUR();msg('↩ Späť');}
function redo(){if(histIdx>=hist.length-1)return;histIdx++;D=JSON.parse(hist[histIdx]);_sv();ek=null;iec=null;newItem=null;render();updUR();msg('↪ Vpred');}
document.addEventListener('keydown',e=>{
  const t=e.target.tagName;if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();undo();}
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();redo();}
});

/* Priradenie izieb (rooms) je konfigurácia – vždy sa načíta čerstvo z INIT podľa názvu položky,
   aby fungovalo aj pre staré uložené dáta bez tejto informácie. */
function applyRooms(){
  const map={};
  INIT.forEach(c=>c.items.forEach(it=>{if(it.rooms)map[it.n]=it.rooms;}));
  D.forEach(c=>c.items.forEach(it=>{if(map[it.n])it.rooms=map[it.n];else delete it.rooms;}));
}
function uid(){return Math.random().toString(36).slice(2);}
function _sv(){try{localStorage.setItem('rkBytu12',JSON.stringify(D));}catch(e){}const el=document.getElementById('si');if(el){el.classList.add('on');clearTimeout(svT);svT=setTimeout(()=>el.classList.remove('on'),1800);}}
function save(){pushHist();_sv();}
function resetAll(){
  if(!confirm('Zmazať uložené dáta v prehliadači a načítať čerstvú verziu?\n\n(Stav položiek ako Zaplatené/Objednané sa stratí. Ak si chceš zmeny zachovať, najprv daj ⬇ JSON.)'))return;
  try{localStorage.removeItem('rkBytu12');localStorage.removeItem('rkRooms');localStorage.removeItem('rkAlts');}catch(e){}
  D=INIT.map((c,i)=>({...c,color:CC[i],items:c.items.map(it=>({...it,id:uid()}))}));
  roomOn={detska:true,spalna:true};altOn={};
  ek=null;iec=null;newItem=null;coll={};hist=[];histIdx=-1;
  pushHist();_sv();renderCS();render();
  msg('✓ Resetované na čerstvú verziu');
}
function msg(t,ok=true){const el=document.getElementById('fmsg');el.textContent=t;el.style.background=ok?'#1e3a5f':'#dc2626';el.classList.add('on');clearTimeout(msgT);msgT=setTimeout(()=>el.classList.remove('on'),2200);}

/* ── HELPERS ────────────────────────────────────────────── */
const f2=n=>n==null||isNaN(n)?'—':Number(n).toLocaleString('sk-SK',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const tot=c=>{
  let s=0;
  c.items.forEach(it=>{if(!altForItem(it))s+=itemNet(it);});
  ALTS.forEach(a=>{if(altOn[a.id]){const fc=D.find(cc=>cc.items.some(it=>a.covers.includes(it.n)));if(fc===c)s+=a.price;}});
  return s;
};
const grand=()=>D.reduce((s,c)=>s+tot(c),0);
const stTot=st=>D.reduce((s,c)=>s+c.items.filter(i=>i.st===st&&!altForItem(i)).reduce((a,i)=>a+itemNet(i),0),0);
function ev(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sUrl(url){if(!url)return null;try{const u=new URL(url),h=u.hostname.replace('www.',''),p=u.pathname.split('/').filter(Boolean);return p.length?h+'/'+p[p.length-1].slice(0,18):h;}catch(x){return url.slice(0,24);}}

/* ── LIVE UPDATE ────────────────────────────────────────── */
function liveUp(ci,ii,field,el){
  const it=D[ci].items[ii],v=parseFloat(el.value)||0;
  const qty=field==='qty'?v:(it.qty||0),up=field==='up'?v:(it.up||0);
  const off=offQty(it),rt=Math.max(0,qty-off)*up;
  const rtEl=document.getElementById('rt-'+ci+'-'+ii);if(rtEl)rtEl.textContent=f2(rt);
  const catTot=D[ci].items.reduce((s,item,idx)=>s+(idx===ii?rt:itemNet(item)),0);
  ['cst-','cht-'].forEach(pfx=>{const e=document.getElementById(pfx+ci);if(e)e.textContent=f2(catTot);});
  const csEl=document.getElementById('cs-'+ci);if(csEl)csEl.textContent=f2(catTot);
  const g=D.reduce((s,c,ci2)=>s+(ci2===ci?catTot:tot(c)),0);
  const gs=document.getElementById('cs-grand');if(gs)gs.textContent=f2(g);
  renderStats();
}
function ic(ci,ii,f,v){
  if(!iec||iec.ci!==ci||iec.ii!==ii||iec.f!==f)return;
  const it=D[ci].items[ii];if(f==='qty'||f==='up')it[f]=v===''?null:parseFloat(v);else it[f]=v;
  iec=null;save();render();
}

/* ── STATS ──────────────────────────────────────────────── */
function calc(){
  let goods=0,work=0,paid=0,ded=0;
  D.forEach(c=>c.items.forEach(it=>{
    const v=itemNet(it);
    if(it.sup==='Modul Company')work+=v; else goods+=v;
    if(it.st==='Zaplatené')paid+=v;
    ded+=itemDed(it);
  }));
  const totalModul=goods+work;
  // aplikuj aktívne alternatívy: odober pokryté Modul položky, pridaj cenu alternatívy
  let altAdd=0,altReplNet=0,altSaving=0;
  ALTS.forEach(a=>{
    if(!altOn[a.id])return;
    let covNet=0;D.forEach(c=>c.items.forEach(it=>{if(a.covers.includes(it.n))covNet+=itemNet(it);}));
    altReplNet+=covNet;altAdd+=a.price;altSaving+=(covNet-a.price);
  });
  const workAfter=work-altReplNet;
  const vat=0; // Modul bez DPH – 23 % sa už neráta
  const total=goods+workAfter+altAdd;
  return {goods,work:workAfter,vat,paid,total,totalModul,altAdd,altSaving,ded,
          anyOff:Object.values(roomOn).some(v=>!v),anyAlt:Object.values(altOn).some(v=>v)};
}
function renderStats(){
  const c=calc();
  document.getElementById('stats').innerHTML=[
    ['SPOLU (bez DPH)',f2(c.total),'background:rgba(30,58,95,.08);border-color:#1e3a5f'],
    ['Práce Modul',f2(c.work),'background:rgba(37,99,235,.06);border-color:#93c5fd'],
    ['Materiál / tovar',f2(c.goods),'background:rgba(22,163,74,.08);border-color:#86efac'],
    ['🟢 Zaplatené',f2(c.paid),''],
  ].map(([l,v,s])=>`<div class="stat" style="${s}"><div class="sl">${l}</div><div class="sv">${v}</div></div>`).join('');
  renderRooms();renderAlts();
}
/* ── PREPÍNAČE IZIEB ────────────────────────────────────── */
function renderRooms(){
  const bar=document.getElementById('rooms-bar');if(!bar)return;
  bar.innerHTML='<span class="rooms-lbl">Prerábka izieb:</span>'+Object.keys(ROOMS).map(k=>{
    const r=ROOMS[k],on=roomOn[k],sav=roomSaving(k);
    return `<label class="rtog${on?'':' off'}"><input type="checkbox" ${on?'checked':''} onchange="toggleRoom('${k}',this.checked)"><span class="rtog-t">${r.label} (${r.area} m²)</span><span class="rtog-a">${on?'':'−'+f2(sav)}</span></label>`;
  }).join('');
  const c=calc();
  if(c.anyOff)bar.innerHTML+=`<span class="rooms-save">Ušetríš ${f2(c.ded)}</span>`;
}
function toggleRoom(k,on){roomOn[k]=on;try{localStorage.setItem('rkRooms',JSON.stringify(roomOn));}catch(e){}render();}
/* ── ALTERNATÍVNE PONUKY (prepínač) ─────────────────────── */
function renderAlts(){
  const bar=document.getElementById('alts-bar');if(!bar)return;
  if(!ALTS.length){bar.style.display='none';return;}
  const c=calc();
  let html='<span class="rooms-lbl">Alternatívne ceny:</span>';
  html+=ALTS.map(a=>{
    let covNet=0;D.forEach(cc=>cc.items.forEach(it=>{if(a.covers.includes(it.n))covNet+=itemNet(it);}));
    const modul=covNet,on=altOn[a.id];
    return `<label class="atog${on?' on':''}"><input type="checkbox" ${on?'checked':''} onchange="toggleAlt('${a.id}',this.checked)">
      <span class="atog-t">${a.label} ${a.firm?'<span class="atog-firm">ponuka</span>':'<span class="atog-orient">orient.</span>'}</span>
      <span class="atog-p"><s>${f2(modul)}</s> → <b>${f2(a.price)}</b> <span class="atog-prov">${a.provider}</span></span>
      <span class="atog-s">−${f2(modul-a.price)}</span>
      ${a.note?`<span class="atog-note">${a.note}</span>`:''}</label>`;
  }).join('');
  html+=`<span class="alts-sum">Modul: <b>${f2(c.totalModul)}</b> &nbsp;|&nbsp; s alternatívami: <b style="color:#15803d">${f2(c.total)}</b>${c.anyAlt?` &nbsp;(ušetríš ${f2(c.altSaving)})`:''}</span>`;
  bar.innerHTML=html;
}
function toggleAlt(id,on){
  altOn[id]=on;
  if(on){const a=ALTS.find(x=>x.id===id);if(a&&a.group)ALTS.forEach(x=>{if(x.group===a.group&&x.id!==id)altOn[x.id]=false;});}
  try{localStorage.setItem('rkAlts',JSON.stringify(altOn));}catch(e){}render();
}

/* ── CATEGORY SUMMARY ───────────────────────────────────── */
function togCS(){csOpen=!csOpen;document.getElementById('cs-body').style.display=csOpen?'block':'none';document.getElementById('cs-tog').textContent=csOpen?'▴':'▾';if(csOpen)renderCS();}
function goCat(ci){
  if(coll[ci]){coll[ci]=false;renderCats();}
  const doScroll=()=>{
    const el=document.getElementById('cat-'+ci);if(!el)return;
    const tb=document.querySelector('.topbar');
    const off=(tb?tb.offsetHeight:48)+10;
    const y=el.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0)-off;
    window.scrollTo({top:y<0?0:y,behavior:'smooth'});
    el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
  };

}

          <th style="width:11%;text-align:right">Cena/ks</th><th style="width:13%;text-align:right">Spolu (bez DPH)</th>
          ${anyOff?'<th style="width:8%;text-align:right;color:#dc2626">− izby</th>':''}
          <th style="width:11%">Stav</th><th style="width:11%">Odkaz</th><th style="width:8%"></th>
        </tr></thead>
        <tbody>${tbody}
          <tr class="sr">
            <td colspan="5" style="padding:7px 12px"><span class="srl">∑ medzisúčet – ${cat.items.length} položiek</span></td>
            <td class="srv" style="padding:7px 10px" id="cst-${ci}">${f2(t)}</td>
            ${anyOff?`<td class="srv" style="padding:7px 10px;color:#dc2626;font-size:14px">${catDed>0?'−'+f2(catDed):''}</td>`:''}
            <td colspan="3"></td>
          </tr>
          <tr><td colspan="${nc}"><button class="addbtn" onclick="addRow(${ci})">＋ Pridať položku</button></td></tr>
        </tbody></table></div></div>`;
    }
  }).join('');
  if(iec)setTimeout(()=>{const i=document.querySelector('.inp');if(i){i.focus();if(i.select)i.select();}},12);
  if(ek)setTimeout(()=>{const f=document.getElementById('ep-n');if(f)f.focus();},12);
  if(csOpen)renderCS();
}

function render(){renderStats();renderCats();}
function togC(ci){coll[ci]=!coll[ci];renderCats();}
function togEp(ci,ii){
  const k=ci+'-'+ii;
  if(ek===k){if(newItem&&newItem.ci===ci&&newItem.ii===ii){D[ci].items.splice(ii,1);newItem=null;ek=null;save();render();return;}ek=null;}
  else ek=k;
  iec=null;renderCats();
}
function cancelEp(){
  if(newItem){D[newItem.ci].items.splice(newItem.ii,1);newItem=null;ek=null;save();render();return;}
  ek=null;renderCats();
}
function saveEp(ci,ii){
  const g=id=>document.getElementById(id),it=D[ci].items[ii];
  it.n=g('ep-n').value.trim()||it.n;it.t=g('ep-t').value.trim();it.mj=g('ep-mj').value.trim();
  it.st=g('ep-st').value;
  it.qty=g('ep-qty').value===''?null:parseFloat(g('ep-qty').value);
  it.up=g('ep-up').value===''?null:parseFloat(g('ep-up').value);
  it.sup=g('ep-sup').value.trim();it.url=g('ep-url').value.trim();it.note=g('ep-note').value.trim();
  newItem=null;ek=null;save();render();
}
function chSt(ci,ii,v){D[ci].items[ii].st=v;save();renderCats();renderStats();}
function stIc(ci,ii,f){iec={ci,ii,f};ek=null;renderCats();}
function addRow(ci){
  D[ci].items.push({id:uid(),n:'Nová položka',t:'',mj:'ks',qty:1,up:0,sup:'',url:'',st:'Odhad',note:''});
  const ii=D[ci].items.length-1;newItem={ci,ii};ek=ci+'-'+ii;iec=null;save();renderCats();
}
function delRow(ci,ii){
  if(!confirm('Zmazať "'+D[ci].items[ii].n+'"?'))return;
  if(newItem&&newItem.ci===ci&&newItem.ii===ii)newItem=null;
  D[ci].items.splice(ii,1);ek=null;iec=null;save();render();
}
function dSt(e,ci,ii){drag={ci,ii};e.dataTransfer.effectAllowed='move';}
function dOv(e,ci,ii){e.preventDefault();document.querySelectorAll('tr.R').forEach(r=>r.classList.remove('drag-over'));if(drag&&drag.ci===ci&&drag.ii!==ii)e.currentTarget.style.outline='2px dashed #3b82f6';}
function dLv(e){e.currentTarget.style.outline='';}
function dDp(e,ci,ii){
  e.preventDefault();document.querySelectorAll('tr.R').forEach(r=>r.style.outline='');
  if(!drag||drag.ci!==ci||drag.ii===ii){drag=null;return;}
  const[m]=D[ci].items.splice(drag.ii,1);D[ci].items.splice(ii,0,m);drag=null;save();renderCats();
}
function expJSON(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,d:new Date().toISOString(),data:D},null,2)],{type:'application/json;charset=utf-8'}));
  a.download='rekonstrukcia_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  msg('✓ JSON záloha uložená');
}
function togImp(){document.getElementById('improw').classList.toggle('h');document.getElementById('finp').value='';}
function impJSON(inp){
  const file=inp.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{try{
    const p=JSON.parse(e.target.result),raw=Array.isArray(p)?p:(p.data||null);
    if(!raw)throw new Error('Neplatný formát');
    D=raw.map((c,i)=>({...c,color:c.color||CC[i%CC.length],items:(c.items||[]).map(it=>({...it,id:it.id||uid()}))}));
    applyRooms();
    ek=null;iec=null;newItem=null;coll={};hist=[];histIdx=-1;save();renderCS();render();togImp();
    msg('✓ Načítané: '+D.reduce((s,c)=>s+c.items.length,0)+' položiek');
  }catch(err){msg('✗ '+err.message,false);}};r.readAsText(file,'utf-8');
}

/* Re-render on resize (desktop↔mobile switch) */
let resizeT;window.addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>renderCats(),150);});

init();
</script>
</body>
</html>
